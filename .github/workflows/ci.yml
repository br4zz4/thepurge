name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

      - name: build
        run: make build

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install toolchain
        run: pacman -Syu --noconfirm git go

      - uses: actions/checkout@v4

      - name: build and test
        run: |
          go vet ./...
          go test ./...
          make build
