version: 2

project_name: thepurge

before:
  hooks:
    - go mod tidy

builds:
  - id: thepurge
    main: ./cmd/thepurge
    binary: thepurge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X br4zz4/thepurge/internal/version.Version={{ .Tag }}

archives:
  - id: thepurge
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: br4zz4
    name: thepurge
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
